server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: We intentionally do NOT set Cross-Origin-Embedder-Policy here.
    # COEP: require-corp blocks YouTube iframes and other 3rd-party embeds.
    # onnxruntime-web works fine in single-threaded WASM mode without COEP.
    # COOP same-origin is kept for security without blocking embeds.
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WASM files — no COEP, just allow cross-origin reads
    location ~* \.wasm$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { application/wasm wasm; }
    }

    # ONNX model file
    location ~* \.onnx$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # JS/CSS static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
}
